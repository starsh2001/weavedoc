# WeaveDoc project config. Created by `weavedoc init`.
# See .weavedoc/FORMATS.md for the parser contract.
version: 3
language: ko              # prose language for this project; set once at init
paths:
  inbox: inbox
  materials: materials
  truths: truths
  documents: documents
fidelity:                # the mandatory gate — weavedoc's warranty; never skipped, never downgraded
  # contradiction + grounding (every claim traces to a material; nothing contradicts the source) is ALWAYS on.
  completeness: off      # off | required — a missing *required* element is a violation (contracts, SOWs)
conflicts:               # source-vs-source conflict handling — detection is review's #1 priority, never off
  detection: deep        # standard | deep — how hard to hunt conflicts between materials (never skipped)
verify:                  # per-transformation fidelity check — upstream of the document-level review gate
  strength: 2            # 1=block on critical · 2=+should-fix · 3=+nice-to-have
  max_rounds: 5          # exceeded -> escalate to the user, never auto-pass
  scale: standard        # skip | light | standard | full — project default; format risk overrides per material
  repeat:                # clean rounds IN A ROW required to pass, by scale. One clean round proves the
    skip:     0          # round found nothing; two prove the target is quiet. A single pass is what a
    light:    1          # real run mistook for "done" four times, each time with defects still in place.
    standard: 1
    full:     2          # the level used when the target is risky — that is where the second round pays
review:                  # advisory quality pass — improves the doc but NEVER blocks consecration
  strength: 1            # 1=block on critical · 2=+should-fix · 3=+nice-to-have
  max_rounds: 5          # exceeded -> escalate to the user, never auto-pass
  scale: standard        # skip | light | standard | full
  repeat:                # clean rounds IN A ROW required to pass, by scale
    skip:     0
    light:    1
    standard: 1
    full:     2
gaps:                    # mine completeness register (weavedoc-gaps skill + `weavedoc gaps` scan)
  # markers: 미정|미완성|미확정|미상|TBD|TODO|추후 보강|추후 작업|추후 결정|정해지지 않|미해결
  #   ^ project-language incompleteness markers for the declared scan (grep alternation).
  #     Commented out = the default above applies; uncomment to override per project.
