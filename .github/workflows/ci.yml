name: ci

# Phase 2 (IMPROVEMENT_PLAN WD-QA-001~003): the same suite on PRs, pushes and tags.
# Cost profile (private-repo Actions minutes: Windows ×2, macOS ×10; the suite runs ~2.5min on
# Windows): Ubuntu runs on every trigger; Windows + macOS run on tags and manual dispatch only.
# macOS is REQUIRED since 2026-08-04 (plan §11): the census quartet resolved in v0.3.4 (a side
# effect of the index-reconciliation rewrite), the revert condition fired, and the user promoted
# it — a macOS-only regression now blocks the release, which is what "supported" means.

on:
  push:
    branches: ["main", "improve/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '18'          # the declared floor; the runtime uses node:fs/path/crypto only
      - name: parse checks (the runtime, and every shell script that gates or ships a release)
        # release-notes.sh is on this list because the `release` job RUNS it at tag time: a syntax
        # error there fails the publish after every other gate has gone green.
        run: |
          for f in tests/*.sh; do bash -n "$f"; done
          node --check .weavedoc/bin/weavedoc.mjs
          # find, not a flat glob: a future lib/subdir/ must not be able to ship unparsed
          find .weavedoc/bin/lib -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: no literal control character in a runtime module
        # The bash runtime this replaced kept its reference-index separator as a raw U+0001, which
        # RENDERS AS NOTHING — reading it as text says "split on the empty string", and the port did
        # exactly that until it was RUN. These modules spell theirs as escapes; this keeps it so.
        run: |
          # This workflow scans ITSELF: the first draft of the comment above put a real U+0001
          # into the YAML, which is the same invisible-character trap one layer out.
          # THE BUNDLED CONTRACTS TOO (2026-08-08.7). The scan covered runtime modules only, so four
          # 0x14 bytes rode into `.weavedoc/schemas/v3` and shipped green: a comment rewrite wrote a
          # U+2014 through a latin1 writer, which keeps the low byte. Comments, so the parser never
          # saw them — but these files ARE the format, and a contract with control characters in it
          # is not a contract anyone should have to diff twice.
          for f in .weavedoc/bin/weavedoc.mjs $(find .weavedoc/bin/lib -name '*.mjs') \
                   .weavedoc/schema $(find .weavedoc/schemas -type f) .github/workflows/ci.yml; do
            n=$(node tests/ctlscan.mjs "$f" | tail -1 | sed 's/[^0-9]//g')
            [ "$n" = 0 ] || { echo "$f holds $n line(s) with a literal control character"; exit 1; }
          done
      - name: shellcheck (errors block; the full style pass is a §9 release condition)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck --severity=error tests/*.sh

  regression-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: generate ko_KR.UTF-8 (pass_locales compares real locale behavior, not a warning)
        run: sudo locale-gen ko_KR.UTF-8
      - name: run the regression suite
        # One runtime since bundle 2026-08-05.3, so one run. The harness defaults to the shipped
        # runtime — the default was the bash reference while both shipped, which meant a plain local
        # run graded the wrong one.
        run: bash tests/regress.sh
      - name: executed-case artifact (§7.3 — the case ID list, not just a PASS count)
        if: always()
        run: |
          key_dir=$(ls -d "${TMPDIR:-/tmp}"/wd-reg-* 2>/dev/null | head -1) || true
          mkdir -p "$RUNNER_TEMP/ci-artifact"
          { echo "commit: $GITHUB_SHA"
            echo "bundle: $(cat .weavedoc/VERSION)"
            echo "os: $(uname -sr)"
            echo "bash: $BASH_VERSION"
            echo "awk: $(awk --version 2>/dev/null | head -1)"
            echo "sed: $(sed --version 2>/dev/null | head -1)"
          } > "$RUNNER_TEMP/ci-artifact/env.txt"
          [ -n "$key_dir" ] && ls "$key_dir/res" > "$RUNNER_TEMP/ci-artifact/executed-cases.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-ubuntu
          path: ${{ runner.temp }}/ci-artifact/
      - name: clean worktree after tests (Phase 2 completion condition)
        # always(): a FAILING suite is exactly when a case is most likely to have left the tree
        # dirty, and without this the check is skipped on every run that would have proved it.
        if: always()
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "worktree not clean after the suite:"; echo "$status"; exit 1
          fi

  # Windows is the primary user environment and costs 2x minutes — ~2.5min wall per sweep since
  # v0.5.12 (it was ~35min when this comment was written); macOS costs 10x. Both run where they
  # matter contractually — tags — and on demand.
  regression-full:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            required: true
          - os: macos-latest
            required: true    # promoted 2026-08-04 — census quartet resolved in v0.3.4 (§11)
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: macOS GNU toolchain (documented requirement — default BSD tools are unsupported)
        if: runner.os == 'macOS'
        run: |
          brew install bash gawk gnu-sed coreutils
          echo "/usr/local/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          # gawk ships no gnubin dir and installs no `awk` link, so `awk` on this leg stayed
          # /usr/bin/awk (BWK) for its whole life — this job has been testing an UNSUPPORTED
          # toolchain while claiming otherwise. The tool's own preflight cannot catch it: BWK awk
          # answers `awk --version` with exit 0 too. Found 2026-08-05 by the v0.4.0 tag run, where
          # the specified diagnostic order came out in BWK's hash order — PROCINFO["sorted_in"] is
          # a gawk extension and every other awk ignores it in silence.
          mkdir -p "$RUNNER_TEMP/gnubin"
          ln -sf "$(brew --prefix gawk)/bin/gawk" "$RUNNER_TEMP/gnubin/awk"
          echo "$RUNNER_TEMP/gnubin" >> "$GITHUB_PATH"
      - name: and the GNU toolchain is the one actually on PATH (a silent BSD fallback is what this leg exists to catch)
        if: runner.os == 'macOS'
        run: |
          # A separate step on purpose: $GITHUB_PATH only takes effect from the NEXT step on.
          for t in awk sed; do
            v=$("$t" --version 2>/dev/null | head -1)
            case "$v" in *GNU*) echo "$t → $v" ;;
                          *) echo "$t is not GNU: [${v:-no --version}] — the leg would silently grade a toolchain the tool does not support"; exit 1 ;;
            esac
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: run the regression suite
        run: bash tests/regress.sh
      - name: executed-case artifact (§7.3)
        if: always()
        run: |
          key_dir=$(ls -d "${TMPDIR:-/tmp}"/wd-reg-* 2>/dev/null | head -1) || true
          mkdir -p "$RUNNER_TEMP/ci-artifact"
          { echo "commit: $GITHUB_SHA"
            echo "bundle: $(cat .weavedoc/VERSION)"
            echo "os: $(uname -sr)"
            echo "bash: $BASH_VERSION"
            echo "awk: $(awk --version 2>/dev/null | head -1)"   # the Linux leg has recorded these
            echo "sed: $(sed --version 2>/dev/null | head -1)"   # since day one; this leg did not,
          } > "$RUNNER_TEMP/ci-artifact/env.txt"                 # which is why the BSD awk went
                                                                 # unnoticed. One rule, one spelling.
          [ -n "$key_dir" ] && ls "$key_dir/res" > "$RUNNER_TEMP/ci-artifact/executed-cases.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.os }}
          path: ${{ runner.temp }}/ci-artifact/
      - name: clean worktree after tests
        # Same rule as the Linux job above — one spelling of the §9 completion condition.
        if: always()
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "worktree not clean after the suite:"; echo "$status"; exit 1
          fi

  # The suite runs under bash everywhere — but the DOCUMENTED Windows invocation is PowerShell
  # (Git Bash pays ~290ms per process to emulate Unix), and until v0.5.1 no CI job ever executed
  # that path: the recommended way to run the tool was the one way nobody tested. A smoke, not a
  # sweep: it proves the entrypoint runs and answers under pwsh, which is the shape of the claim.
  powershell-smoke:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: the documented Windows invocation answers under PowerShell
        shell: pwsh
        run: |
          # Two traps this step has already sprung, both measured on its own first outings:
          # the runner may promote native nonzero exits to terminating errors (flag off below), and
          # under $ErrorActionPreference='Stop' a native command's STDERR line becomes an error
          # record that terminates the script — the bogus command's usage text killed the step
          # before the assertion about it ever ran. Its stderr is swallowed; the exit code is the
          # assertion. The explicit `exit 0` keeps the last probe's rc from leaking into the step's.
          $PSNativeCommandUseErrorActionPreference = $false
          $v = node .weavedoc/bin/weavedoc.mjs version
          $v
          if ($LASTEXITCODE -ne 0) { throw "version exited $LASTEXITCODE" }
          if (-not ($v -match 'fingerprint:')) { throw "no fingerprint line — the runtime did not answer" }
          node .weavedoc/bin/weavedoc.mjs bogus-command-name 2>$null
          if ($LASTEXITCODE -eq 0) { throw "an unknown command exited 0 under pwsh" }
          # One REAL command beyond version (review #6: the smoke asserted only version + an
          # unknown command). validate in an empty dir must refuse in its own words — a named
          # diagnostic proves the checks ran under pwsh, not merely that the process started.
          New-Item -ItemType Directory -Force smoke-empty | Out-Null
          Push-Location smoke-empty
          $val = node ..\.weavedoc\bin\weavedoc.mjs validate
          $valrc = $LASTEXITCODE
          Pop-Location
          if ($valrc -eq 0) { throw "validate exited 0 in an empty non-mine directory" }
          if (-not ($val -match 'CFG-PATH-MISSING')) { throw "validate's refusal did not name CFG-PATH-MISSING — the checks did not run" }
          exit 0

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: bundle manifest is two-run byte-identical (Phase 0 condition, kept honest in CI)
        run: |
          bash tests/make-manifest.sh > m1.txt
          bash tests/make-manifest.sh > m2.txt
          cmp m1.txt m2.txt
          sha256sum m1.txt

  # A tag publishes only after every required job of THIS run is green — including the full
  # Windows sweep. The notes are generated, never hand-written: the "new commands" list is the
  # dispatch diff (the v0.2.0 tag hand-listed six commands its predecessor already had).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, regression-linux, manifest, regression-full, powershell-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # THE SAME FLOOR THE GATES RAN (external review, v0.5.5). Without this step the release
          # job took ubuntu-latest's default node and the evidence block published `node=v22.23.1`
          # while every gate — lint, regression-linux, the 3-OS matrix — ran on 18. The evidence
          # named a runtime nothing was verified against.
          node-version: '18'
      - name: cohesion — the tag is SemVer-shaped and CHANGELOG-claimed; VERSION, CHANGELOG and schema agree (doccheck)
        # The SHAPE is asserted (v0.5.2, external review): before this, `vfoo` would have published a
        # release. Anchored regex, not a case-glob — the glob `v[0-9]*.[0-9]*.[0-9]*` accepted
        # `v0.5.2yolo` and `v1x.2y.3z` (cold review), and the first regex accepted `v01.2.3`
        # (review #6) — SemVer forbids leading zeros.
        # The tag must also be a release the CHANGELOG CLAIMS (review #6): `v9.9.9` would otherwise
        # publish the current bundle under a version nobody recorded. This asserts against the
        # EXISTING record — the '**vX.Y.Z — ' line every release section opens with — so it links
        # to the one source of truth instead of inventing a second. The tag→bundle-date MAPPING
        # stays echoed, not asserted: bundles are date labels and no formal rule links the two.
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag shape ok: $GITHUB_REF_NAME"
          else
            echo "tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH (leading zeros included) — refusing to publish"; exit 1
          fi
          # Scoped to the TOP section only (review #7): past claim lines stay in the file forever,
          # so a whole-file grep let an OLD tag re-pointed at the wrong HEAD pass — measured with
          # v0.5.1 against the v0.5.2 tree. Only the newest '## <bundle>' section speaks for THIS
          # tree; a legitimate re-run of an old tag checks out ITS OWN tree, whose top section
          # claims it. Line-anchored so a mid-sentence mention cannot satisfy the gate.
          # And the top section declares EXACTLY ONE release (review #8): "any anchored claim
          # matches" let a second claim line smuggled beside the real one revive an old tag —
          # measured, v0.5.1 passing against the v0.5.3 tree. The claims are extracted, counted,
          # and the single one must BE this tag.
          claims=$(awk '/^## /{n++} n==1' CHANGELOG.md | sed -n 's/^\*\*\(v[0-9][0-9.]*\) — .*/\1/p')
          nclaims=$(printf '%s\n' "$claims" | grep -c . || true)
          if [ "$nclaims" -ne 1 ]; then
            echo "the top CHANGELOG section declares $nclaims release claims ($(printf '%s' "$claims" | tr '\n' ' ')) — exactly one '**vX.Y.Z — ' line may open a bundle; refusing to publish"; exit 1
          fi
          if [ "$claims" = "$GITHUB_REF_NAME" ]; then
            echo "tag claimed by the top CHANGELOG section: $GITHUB_REF_NAME"
          else
            echo "the top CHANGELOG section claims '$claims', not the tag '$GITHUB_REF_NAME' — refusing to publish"; exit 1
          fi
          bash tests/doccheck.sh
          # The evidence line names everything that identifies WHAT was published (review #8 P2):
          # tag, bundle label, schema version, the runtime fingerprint (two installs can share a
          # date label), the node that ran the gates, and the manifest digest that is the release
          # asset's own identity. It is echoed into the job log AND the release notes below.
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "bundle=$(cat .weavedoc/VERSION)"
            echo "schema=$(grep -m1 '^schema.version:' .weavedoc/schema | sed 's/.*:[[:space:]]*//')"
            echo "fingerprint=$(node .weavedoc/bin/weavedoc.mjs version | sed -n 's/^fingerprint:[[:space:]]*\([0-9a-f]*\).*/\1/p')"
            # `node_gate`, not `node`: this job pins the same '18' the gate jobs declare (the step
            # above), so the field names the runtime the verdicts were produced on rather than
            # whatever the release runner happened to ship.
            echo "node_gate=$(node --version)"
            echo "manifest_sha256=$(bash tests/make-manifest.sh | sha256sum | awk '{print $1}')"
          } | tee release-evidence.txt
          # A field whose command failed comes out EMPTY, and `| tee` swallows the status — the
          # evidence would publish `fingerprint=` and nothing would notice (cold review). A check
          # whose emptiness looks like success has to assert its own extraction.
          while IFS= read -r kv; do
            case "$kv" in *=) echo "release evidence field '${kv%=}' came out empty — the extraction broke; refusing to publish"; exit 1 ;; esac
          done < release-evidence.txt
      - name: build the bundle manifest
        run: |
          bash tests/make-manifest.sh > bundle.manifest
          sha256sum bundle.manifest | awk '{print $1}' > bundle.manifest.sha256
      - name: generate release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo v0.1.0)
          bash tests/release-notes.sh "$prev" "$GITHUB_REF_NAME" > notes.md
          # The identity block travels WITH the release, not only in a job log that expires.
          { echo; echo '## release evidence'; echo; echo '```'; cat release-evidence.txt; echo '```'; } >> notes.md
          cat notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # IDEMPOTENT (external review, v0.5.13). A tag can reach this job twice — the push run and
          # a workflow_dispatch on the same tag, which is exactly what the 2026-08-06 Actions outage
          # forced us to do — and `gh release create` fails on the second, so a run whose 3-OS gates
          # were all green ended red on an already-published release. Publishing is not the gate;
          # the gates above are. So: if a release exists for this tag, verify its published
          # bundle.manifest is byte-identical to this tree's and succeed.
          #
          # WHAT THIS DOES AND DOES NOT PROVE (cold review): the manifest covers the runtime, schema,
          # templates, READ/FORMATS and the skills — the shipped bundle. Two commits with identical
          # bundle bytes and different docs or tests hash the SAME, so this check says "the same
          # bundle is already published under this tag", not "the same commit".
          #
          # Every gh call is guarded: the default shell is `bash -e`, and only the `view` probe sits
          # inside an `if`. An unguarded `download` turned a missing/renamed asset into an opaque
          # step failure — the very "green gates, red job" outcome this replaced.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            want=$(cat bundle.manifest.sha256)
            rm -rf published && mkdir -p published
            if ! gh release download "$GITHUB_REF_NAME" -p bundle.manifest -D published --clobber; then
              echo "a release exists for $GITHUB_REF_NAME but its bundle.manifest asset could not be"
              echo "downloaded — it was published without that asset, or under another name."
              echo "refusing to guess; resolve by hand"; exit 1
            fi
            if [ ! -s published/bundle.manifest ]; then
              echo "the published bundle.manifest is empty or missing after download — resolve by hand"; exit 1
            fi
            have=$(sha256sum published/bundle.manifest | awk '{print $1}')
            if [ "$want" != "$have" ]; then
              echo "a release already exists for $GITHUB_REF_NAME and its bundle.manifest differs"
              echo "  published: $have"
              echo "  this tree: $want"
              echo "refusing to overwrite — resolve by hand"; exit 1
            fi
            echo "release $GITHUB_REF_NAME already published with this bundle ($have) — nothing to do"
          else
            gh release create "$GITHUB_REF_NAME" --title "WeaveDoc $GITHUB_REF_NAME" \
              --notes-file notes.md bundle.manifest bundle.manifest.sha256
          fi
