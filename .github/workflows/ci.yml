name: ci

# Phase 2 (IMPROVEMENT_PLAN WD-QA-001~003): the same suite on PRs, pushes and tags.
# Cost profile (private-repo Actions minutes: Windows ×2, macOS ×10, and the suite is ~35min on
# Windows): Ubuntu runs on every trigger; Windows + macOS run on tags and manual dispatch only.
# macOS is REQUIRED since 2026-08-04 (plan §11): the census quartet resolved in v0.3.4 (a side
# effect of the index-reconciliation rewrite), the revert condition fired, and the user promoted
# it — a macOS-only regression now blocks the release, which is what "supported" means.

on:
  push:
    branches: ["main", "improve/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '18'          # the declared floor; the runtime uses node:fs/path/crypto only
      - name: parse checks (BOTH runtimes — the bundle ships both for one release)
        run: |
          bash -n .weavedoc/bin/weavedoc
          bash -n tests/regress.sh
          bash -n tests/make-manifest.sh
          node --check .weavedoc/bin/weavedoc.mjs
          for f in .weavedoc/bin/lib/*.mjs; do node --check "$f"; done
      - name: no literal control character in a runtime module
        # The bash runtime keeps its reference-index separator as a raw U+0001, which RENDERS AS
        # NOTHING — reading it as text says "split on the empty string" and the port did exactly
        # that until it was run. The Node modules spell theirs as escapes; this keeps it that way.
        run: |
          # This workflow scans ITSELF: the first draft of the comment above put a real U+0001
          # into the YAML, which is the same invisible-character trap one layer out.
          for f in .weavedoc/bin/weavedoc.mjs .weavedoc/bin/lib/*.mjs .github/workflows/ci.yml; do
            n=$(node tests/ctlscan.mjs "$f" | tail -1 | sed 's/[^0-9]//g')
            [ "$n" = 0 ] || { echo "$f holds $n line(s) with a literal control character"; exit 1; }
          done
      - name: shellcheck (errors block; the full style pass is a §9 release condition)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck --severity=error .weavedoc/bin/weavedoc tests/regress.sh tests/make-manifest.sh

  regression-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: generate ko_KR.UTF-8 (pass_locales compares real locale behavior, not a warning)
        run: sudo locale-gen ko_KR.UTF-8
      - name: run the regression suite against the SHIPPED runtime (Node)
        # Node is the product from stage 6 on, so it is the gate. The bash run below is the parity
        # reference, kept for one release — if the two ever disagree, the suite says which.
        run: WD_BIN="node .weavedoc/bin/weavedoc.mjs" bash tests/regress.sh
      - name: run the same suite against the bash reference
        run: bash tests/regress.sh
      - name: executed-case artifact (§7.3 — the case ID list, not just a PASS count)
        if: always()
        run: |
          key_dir=$(ls -d "${TMPDIR:-/tmp}"/wd-reg-* 2>/dev/null | head -1) || true
          mkdir -p "$RUNNER_TEMP/ci-artifact"
          { echo "commit: $GITHUB_SHA"
            echo "bundle: $(cat .weavedoc/VERSION)"
            echo "os: $(uname -sr)"
            echo "bash: $BASH_VERSION"
            echo "awk: $(awk --version 2>/dev/null | head -1)"
            echo "sed: $(sed --version 2>/dev/null | head -1)"
          } > "$RUNNER_TEMP/ci-artifact/env.txt"
          [ -n "$key_dir" ] && ls "$key_dir/res" > "$RUNNER_TEMP/ci-artifact/executed-cases.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-ubuntu
          path: ${{ runner.temp }}/ci-artifact/
      - name: clean worktree after tests (Phase 2 completion condition)
        # always(): a FAILING suite is exactly when a case is most likely to have left the tree
        # dirty, and without this the check is skipped on every run that would have proved it.
        if: always()
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "worktree not clean after the suite:"; echo "$status"; exit 1
          fi

  # Windows is the primary user environment but costs 2x minutes and ~35min wall per sweep;
  # macOS costs 10x. Both run where they matter contractually — tags — and on demand.
  regression-full:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            required: true
          - os: macos-latest
            required: true    # promoted 2026-08-04 — census quartet resolved in v0.3.4 (§11)
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: macOS GNU toolchain (documented requirement — default BSD tools are unsupported)
        if: runner.os == 'macOS'
        run: |
          brew install bash gawk gnu-sed coreutils
          echo "/usr/local/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          # gawk ships no gnubin dir and installs no `awk` link, so `awk` on this leg stayed
          # /usr/bin/awk (BWK) for its whole life — this job has been testing an UNSUPPORTED
          # toolchain while claiming otherwise. The tool's own preflight cannot catch it: BWK awk
          # answers `awk --version` with exit 0 too. Found 2026-08-05 by the v0.4.0 tag run, where
          # the specified diagnostic order came out in BWK's hash order — PROCINFO["sorted_in"] is
          # a gawk extension and every other awk ignores it in silence.
          mkdir -p "$RUNNER_TEMP/gnubin"
          ln -sf "$(brew --prefix gawk)/bin/gawk" "$RUNNER_TEMP/gnubin/awk"
          echo "$RUNNER_TEMP/gnubin" >> "$GITHUB_PATH"
      - name: and the GNU toolchain is the one actually on PATH (a silent BSD fallback is what this leg exists to catch)
        if: runner.os == 'macOS'
        run: |
          # A separate step on purpose: $GITHUB_PATH only takes effect from the NEXT step on.
          for t in awk sed; do
            v=$("$t" --version 2>/dev/null | head -1)
            case "$v" in *GNU*) echo "$t → $v" ;;
                          *) echo "$t is not GNU: [${v:-no --version}] — the leg would silently grade a toolchain the tool does not support"; exit 1 ;;
            esac
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: run the regression suite against the SHIPPED runtime (Node)
        run: WD_BIN="node .weavedoc/bin/weavedoc.mjs" bash tests/regress.sh
      - name: run the same suite against the bash reference
        run: bash tests/regress.sh
      - name: executed-case artifact (§7.3)
        if: always()
        run: |
          key_dir=$(ls -d "${TMPDIR:-/tmp}"/wd-reg-* 2>/dev/null | head -1) || true
          mkdir -p "$RUNNER_TEMP/ci-artifact"
          { echo "commit: $GITHUB_SHA"
            echo "bundle: $(cat .weavedoc/VERSION)"
            echo "os: $(uname -sr)"
            echo "bash: $BASH_VERSION"
            echo "awk: $(awk --version 2>/dev/null | head -1)"   # the Linux leg has recorded these
            echo "sed: $(sed --version 2>/dev/null | head -1)"   # since day one; this leg did not,
          } > "$RUNNER_TEMP/ci-artifact/env.txt"                 # which is why the BSD awk went
                                                                 # unnoticed. One rule, one spelling.
          [ -n "$key_dir" ] && ls "$key_dir/res" > "$RUNNER_TEMP/ci-artifact/executed-cases.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.os }}
          path: ${{ runner.temp }}/ci-artifact/
      - name: clean worktree after tests
        # Same rule as the Linux job above — one spelling of the §9 completion condition.
        if: always()
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "worktree not clean after the suite:"; echo "$status"; exit 1
          fi

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: bundle manifest is two-run byte-identical (Phase 0 condition, kept honest in CI)
        run: |
          bash tests/make-manifest.sh > m1.txt
          bash tests/make-manifest.sh > m2.txt
          cmp m1.txt m2.txt
          sha256sum m1.txt

  # A tag publishes only after every required job of THIS run is green — including the full
  # Windows sweep. The notes are generated, never hand-written: the "new commands" list is the
  # dispatch diff (the v0.2.0 tag hand-listed six commands its predecessor already had).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, regression-linux, manifest, regression-full]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: cohesion — tag, VERSION, CHANGELOG, schema are one fact (§9)
        run: |
          bash tests/doccheck.sh
          echo "tag=$GITHUB_REF_NAME · bundle=$(cat .weavedoc/VERSION) · schema=$(grep -m1 '^schema.version:' .weavedoc/schema | sed 's/.*:[[:space:]]*//')"
      - name: build the bundle manifest
        run: |
          bash tests/make-manifest.sh > bundle.manifest
          sha256sum bundle.manifest | awk '{print $1}' > bundle.manifest.sha256
      - name: generate release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo v0.1.0)
          bash tests/release-notes.sh "$prev" "$GITHUB_REF_NAME" | tee notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "WeaveDoc $GITHUB_REF_NAME" \
            --notes-file notes.md bundle.manifest bundle.manifest.sha256
