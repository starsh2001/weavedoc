name: ci

# Phase 2 (IMPROVEMENT_PLAN WD-QA-001~003): the same suite on PRs, pushes and tags.
# Cost profile (private-repo Actions minutes: Windows ×2, macOS ×10, and the suite is ~35min on
# Windows): Ubuntu runs on every trigger; Windows + macOS run on tags and manual dispatch only.
# macOS is best-effort BY DECISION (2026-08-03, plan §11): non-blocking, 4 known index-parsing
# case failures recorded; required promotion is re-tabled if the census quartet is resolved.

on:
  push:
    branches: ["main", "improve/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: bash -n (bin + suite)
        run: |
          bash -n .weavedoc/bin/weavedoc
          bash -n tests/regress.sh
          bash -n tests/make-manifest.sh
      - name: shellcheck (errors block; the full style pass is a §9 release condition)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck --severity=error .weavedoc/bin/weavedoc tests/regress.sh tests/make-manifest.sh

  regression-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: generate ko_KR.UTF-8 (pass_locales compares real locale behavior, not a warning)
        run: sudo locale-gen ko_KR.UTF-8
      - name: run the regression suite
        run: bash tests/regress.sh
      - name: executed-case artifact (§7.3 — the case ID list, not just a PASS count)
        if: always()
        run: |
          key_dir=$(ls -d "${TMPDIR:-/tmp}"/wd-reg-* 2>/dev/null | head -1) || true
          mkdir -p "$RUNNER_TEMP/ci-artifact"
          { echo "commit: $GITHUB_SHA"
            echo "bundle: $(cat .weavedoc/VERSION)"
            echo "os: $(uname -sr)"
            echo "bash: $BASH_VERSION"
            echo "awk: $(awk --version 2>/dev/null | head -1)"
            echo "sed: $(sed --version 2>/dev/null | head -1)"
          } > "$RUNNER_TEMP/ci-artifact/env.txt"
          [ -n "$key_dir" ] && ls "$key_dir/res" > "$RUNNER_TEMP/ci-artifact/executed-cases.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-ubuntu
          path: ${{ runner.temp }}/ci-artifact/
      - name: clean worktree after tests (Phase 2 completion condition)
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "worktree not clean after the suite:"; echo "$status"; exit 1
          fi

  # Windows is the primary user environment but costs 2x minutes and ~35min wall per sweep;
  # macOS costs 10x. Both run where they matter contractually — tags — and on demand.
  regression-full:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            required: true
          - os: macos-latest
            required: false   # non-blocking until promoted or retracted (§7.2)
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: macOS GNU toolchain (documented requirement — default BSD tools are unsupported)
        if: runner.os == 'macOS'
        run: |
          brew install bash gawk gnu-sed coreutils
          echo "/usr/local/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
      - name: run the regression suite
        run: bash tests/regress.sh
      - name: executed-case artifact (§7.3)
        if: always()
        run: |
          key_dir=$(ls -d "${TMPDIR:-/tmp}"/wd-reg-* 2>/dev/null | head -1) || true
          mkdir -p "$RUNNER_TEMP/ci-artifact"
          { echo "commit: $GITHUB_SHA"
            echo "bundle: $(cat .weavedoc/VERSION)"
            echo "os: $(uname -sr)"
            echo "bash: $BASH_VERSION"
          } > "$RUNNER_TEMP/ci-artifact/env.txt"
          [ -n "$key_dir" ] && ls "$key_dir/res" > "$RUNNER_TEMP/ci-artifact/executed-cases.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.os }}
          path: ${{ runner.temp }}/ci-artifact/
      - name: clean worktree after tests
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "worktree not clean after the suite:"; echo "$status"; exit 1
          fi

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: bundle manifest is two-run byte-identical (Phase 0 condition, kept honest in CI)
        run: |
          bash tests/make-manifest.sh > m1.txt
          bash tests/make-manifest.sh > m2.txt
          cmp m1.txt m2.txt
          sha256sum m1.txt

  # A tag publishes only after every required job of THIS run is green — including the full
  # Windows sweep. The notes are generated, never hand-written: the "new commands" list is the
  # dispatch diff (the v0.2.0 tag hand-listed six commands its predecessor already had).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, regression-linux, manifest, regression-full]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: cohesion — tag, VERSION, CHANGELOG, schema are one fact (§9)
        run: |
          bash tests/doccheck.sh
          echo "tag=$GITHUB_REF_NAME · bundle=$(cat .weavedoc/VERSION) · schema=$(grep -m1 '^schema.version:' .weavedoc/schema | sed 's/.*:[[:space:]]*//')"
      - name: build the bundle manifest
        run: |
          bash tests/make-manifest.sh > bundle.manifest
          sha256sum bundle.manifest | awk '{print $1}' > bundle.manifest.sha256
      - name: generate release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo v0.1.0)
          bash tests/release-notes.sh "$prev" "$GITHUB_REF_NAME" | tee notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "WeaveDoc $GITHUB_REF_NAME" \
            --notes-file notes.md bundle.manifest bundle.manifest.sha256
